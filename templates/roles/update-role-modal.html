<script>
function initRolePermissions() {
    const mainCheckAll = document.getElementById('checkall');
    const moduleCheckboxes = document.querySelectorAll('.ischeck');
    const childCheckboxes = document.querySelectorAll('.isscheck');

    // Any module that has an explicit "view_*" checkbox requires it as a
    // baseline: granting any other action in that module forces view on
    // and locks it (visually, via .permission-locked — kept enabled, not
    // `disabled`, so it still submits with the form); a module with no
    // action checked has no view requirement either, so unchecking the
    // module's last action drops view along with it ("module removed").
    const findViewCheckbox = moduleId =>
        [...document.querySelectorAll('.isscheck_' + moduleId)].find(c => c.id.startsWith('view_'));

    const enforceViewMinimum = () => {
        moduleCheckboxes.forEach(m => {
            const viewBox = findViewCheckbox(m.dataset.id);
            if (!viewBox) return;
            const children = document.querySelectorAll('.isscheck_' + m.dataset.id);
            const otherChecked = [...children].some(c => c !== viewBox && c.checked);
            if (otherChecked) viewBox.checked = true;
            viewBox.classList.toggle('permission-locked', otherChecked);
        });
    };

    const updateStates = () => {
        enforceViewMinimum();
        moduleCheckboxes.forEach(m => {
            const children = document.querySelectorAll('.isscheck_' + m.dataset.id);
            m.checked = [...children].every(c => c.checked);
            m.indeterminate = ![...children].every(c => c.checked) && [...children].some(c => c.checked);
        });
        if(mainCheckAll) {
            mainCheckAll.checked = [...childCheckboxes].every(c => c.checked);
            mainCheckAll.indeterminate = ![...childCheckboxes].every(c => c.checked) && [...childCheckboxes].some(c => c.checked);
        }
    };

    updateStates();

    if (mainCheckAll) {
        mainCheckAll.addEventListener('change', e => {
            childCheckboxes.forEach(c => c.checked = e.target.checked);
            moduleCheckboxes.forEach(m => m.checked = e.target.checked);
            updateStates();
        });
    }

    moduleCheckboxes.forEach(m => {
        m.addEventListener('change', e => {
            document.querySelectorAll('.isscheck_' + e.target.dataset.id).forEach(c => c.checked = e.target.checked);
            updateStates();
        });
    });

    childCheckboxes.forEach(c => {
        c.addEventListener('change', e => {
            // Block unchecking a locked view checkbox directly — it can
            // only come off by removing every other action in its module.
            if (e.target.id.startsWith('view_') && !e.target.checked && e.target.classList.contains('permission-locked')) {
                e.target.checked = true;
                return;
            }
            updateStates();
        });
    });

    // HTMX and Notifications
    document.body.addEventListener("roleUpdated", () => {
        if (Notification.permission === "granted") new Notification("{{ trans.role_updated_notification_title }}", { body: "{{ trans.role_updated_notification_body }}" });
    });

    htmx.on("htmx:beforeSwap", (e) => {
        if (e.detail.target.id == "update-role-modal-content" && !e.detail.xhr.response) location.reload();
    });

    const form = document.querySelector('form');
    if (form) {
        form.addEventListener('submit', () => {
            const btn = document.querySelector('.btn-save');
            btn.innerHTML = '<span class="spinner-grow spinner-grow-sm"></span> {{ trans.updating }}';
            btn.disabled = true;
        });
    }
}

initRolePermissions();
document.body.addEventListener('htmx:afterSwap', initRolePermissions);
</script>
