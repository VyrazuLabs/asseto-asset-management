<div class="modal-header bg-dark text-white">
    <h5 class="modal-title">{{ trans.map_fields_title }}</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
</div>
<form method="post" action="{% url 'upload:locations_compare_data' %}" id="mappingForm">
    {% csrf_token %}
    <div class="modal-body">
        <table class="table">
            <thead>
                <tr>
                    <th>{{ trans.location_field }}</th>
                    <th>{{ trans.csv_header }}</th>
                </tr>
            </thead>
            <tbody>
                {% for field in fields %}
                <tr>
                    <td>
                        {{ field }}

                        {% if field in required_fields %}
                            <span class="text-danger">*</span>
                            <div class="text-danger small mt-1 d-none" id="error-{{ forloop.counter }}">
                                {{ trans.this_field_is_required }}
                            </div>
                        {% endif %}
                    </td>

                    <td>
                        <select name="mapping_{{ field }}" class="form-select mapping-select"
                            data-error-id="error-{{ forloop.counter }}"
                            {% if field in required_fields %}data-required="true" {% endif %}>
                            <option value="">{{ trans.select_option }}</option>
                            {% for header in headers %}
                            <option value="{{ header }}">{{ header }}</option>
                            {% endfor %}
                        </select>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">{{ trans.close }}</button>
        <button type="submit" class="btn btn-success" id="importBtn" disabled>
            {{ trans.import_locations }}
        </button>
    </div>
</form>

<script>
    (function () {
        const form = document.getElementById("mappingForm");
        const importBtn = document.getElementById("importBtn");
        const selects = document.querySelectorAll(".mapping-select");

        function hasAnySelection() {
            return Array.from(selects).some(s => s.value !== "");
        }

        function validateRequiredFields(showErrors = false) {
            let isValid = true;

            selects.forEach(select => {
                if (select.dataset.required === "true") {
                    const errorDiv = document.getElementById(select.dataset.errorId);

                    if (select.value === "") {
                        isValid = false;
                        if (showErrors) errorDiv.classList.remove("d-none");
                    } else {
                        errorDiv.classList.add("d-none");
                    }
                }
            });

            return isValid;
        }

        selects.forEach(select => {
            select.addEventListener("change", () => {
                validateRequiredFields(false);
                importBtn.disabled = !hasAnySelection();
            });
        });

        form.addEventListener("submit", function (e) {
            if (!validateRequiredFields(true)) {
                e.preventDefault();
            }
        });

        importBtn.disabled = true;
    })();
</script>
