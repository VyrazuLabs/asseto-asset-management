<div class="modal fade" id="imageModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content" style="border-radius: 16px; border: none; box-shadow: 0 8px 32px rgba(0,0,0,0.12);">
            <div class="modal-header border-0 pb-0">
                <div>
                    <h5 class="fw-bold mb-1"><i class="bi bi-images me-2" style="color: #553af2;"></i>{{ trans.select_image }}</h5>
                    <p class="text-muted small mb-0">{{ trans.select_image_desc|safe }}</p>
                </div>
                <button type="button" class="btn-close" onclick="closeModal()"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="imageModalRowIndex">
                {% if image_map and image_map|length > 0 %}
                <div class="d-flex justify-content-end align-items-center mb-3">
                    <button type="button" class="btn btn-outline-danger btn-sm" style="border-radius: 8px; font-size: 0.75rem;" onclick="clearImageSelection()">
                        <i class="bi bi-trash3 me-1"></i> {{ trans.remove_image }}
                    </button>
                </div>
                <div class="modal-img-grid">
                    {% for filename, path in image_map.items %}
                    <div class="modal-img-item" data-image-path="{{ path }}" onclick="toggleImage(this)">
                        <img src="/{{ path }}" alt="{{ filename }}">
                        <div class="filename">{{ filename }}</div>
                    </div>
                    {% endfor %}
                </div>
                {% else %}
                <div class="d-flex flex-column align-items-center justify-content-center py-5 text-muted" style="min-height: 200px;">
                    <i class="bi bi-inbox fs-1 mb-3"></i>
                    <p class="mb-1">{{ trans.no_images_zip }}</p>
                    <p class="small mb-0">{{ trans.no_images_hint }}</p>
                </div>
                {% endif %}
            </div>
            <div class="modal-footer border-0 pt-0 d-flex justify-content-between">
                <div>
                    <span id="imageModalStatus" class="text-muted small"></span>
                </div>
                <div>
                    <button type="button" class="btn btn-outline-secondary" onclick="closeModal()" style="border-radius: 20px;">{{ trans.cancel }}</button>
                    <button type="button" class="btn btn-purple" onclick="closeModal()" style="border-radius: 20px;">{{ trans.done }}</button>
                </div>
            </div>
        </div>
    </div>
</div>
