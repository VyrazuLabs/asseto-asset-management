{% extends 'layouts/auth-layout.html' %}
{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{% endblock title %}</title>
    <link rel="stylesheet" href={% static 'css/main/app.css' %}>
    <link rel="stylesheet" href={% static 'css/pages/auth.css' %}>
    <link rel="shortcut icon" href={% static 'images/logo/Logo.svg' %} type="image/x-icon">
    <link rel="shortcut icon" href={% static 'images/logo/Logo.png' %} type="image/png">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css" integrity="sha512-vKMx8UnXk60zUwyUnUPM3HbQo8QfmNx7+ltw8Pm5zLusl1XIfwcxo8DbWCqMGKaWeNxWA8yrx5v3SaVpMvR3CA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js" integrity="sha512-VEd+nq25CkR676O+pLBnDW09R7VQX9Mdiij052gVCp5yVH3jGtH70Ho/UUv4mJDsEdTvqRCFZg0NKGiojGnUCw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  </head>

            <div class="d-flex gap-2 mb-3 otp-inputs">
                <input placeholder="1" type="text" maxlength="1" class="otp-box form-control text-center" />
                <input placeholder="2" type="text" maxlength="1" class="otp-box form-control text-center" />
                <input placeholder="3" type="text" maxlength="1" class="otp-box form-control text-center" />
                <input placeholder="4" type="text" maxlength="1" class="otp-box form-control text-center" />
                <input placeholder="5" type="text" maxlength="1" class="otp-box form-control text-center" />
                <input placeholder="6" type="text" maxlength="1" class="otp-box form-control text-center" />
            </div>

            <form id="otpForm" method="POST" action="{% url 'authentication:verify_otp' %}">
                {% csrf_token %}
                {% if messages %}
                    {% for message in messages %}
                    <div class="alert alert-light-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
                <input type="hidden" name="email" value="{{ email }}">
                <input type="hidden" name="otp" id="userOtp">

                <button type="submit" class="btn btn-primary btn-block btn-lg shadow-lg mt-3">
                    Verify
                </button>
            </form>
        </div>
    </div>
    <div class="col-lg-6 d-none d-lg-block">
        <div id="auth-right" class="d-flex justify-content-center align-items-center flex-column">
            <img src="{% static 'images/new_logo/illustration.svg' %}" alt="Illustration" class="img-login display-flex justify-content-center" width="50%">
        </div>
    </div>
</div>
<script src="{% static 'js/pages/verify_otp.js' %}" defer></script>
{% endblock %}
