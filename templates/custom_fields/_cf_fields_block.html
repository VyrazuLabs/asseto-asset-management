{% load cf_tags %}
{% if cf_definitions %}
<div class="custom-fields-section">
  <div class="section-header">
    <div class="cf-icon"><i class="bi bi-list-stars"></i></div>
    <span class="cf-title">{{ trans.custom_fields }}</span>
  </div>
  <div class="cf-grid">
    {% for defn in cf_definitions %}
      <div class="cf-group">
        <label>
          {{ defn.field_label }}
          {% if defn.is_required %}<span class="required">*</span>{% endif %}
        </label>
        {% if defn.field_type == "boolean" %}
          <div class="form-check form-switch">
            <input type="hidden" name="cf_{{ defn.field_key }}" value="off">
            <input type="checkbox"
              class="form-check-input"
              id="cf_{{ defn.field_key }}"
              name="cf_{{ defn.field_key }}"
              value="on"
              {% if cf_values|get_cf_value:defn.field_key == "true" or cf_values|get_cf_value:defn.field_key == "on" %}checked{% endif %}>
          </div>
        {% else %}
          <input
            type="{{ defn.field_type|cf_html_type }}"
            class="form-control"
            id="cf_{{ defn.field_key }}"
            name="cf_{{ defn.field_key }}"
            value="{{ cf_values|get_cf_value:defn.field_key }}"
            {% if defn.field_type == "decimal" %}step="any"{% endif %}
            {% if defn.is_required %}required{% endif %}>
        {% endif %}
      </div>
    {% endfor %}
  </div>
</div>
{% endif %}
